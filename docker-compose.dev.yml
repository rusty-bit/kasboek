# LOCAL DEVELOPMENT ONLY. Never use this file as a Portainer stack on the NAS:
# the relative ./data path would land on the NAS rootfs. Use docker-compose.yml there.
#   docker compose -f docker-compose.dev.yml up --build
services:
  kasboek:
    build: .
    image: kasboek:dev
    environment:
      DATA_DIR: /data
      TZ: Europe/Amsterdam
    volumes:
      - ./data:/data
      - ./app:/app/app
    ports:
      - "8000:8000"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
