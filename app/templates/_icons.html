{# One icon set, one stroke: 24px grid, 1.8 stroke, round joins. #}
{% macro icon(name, size=20) -%}
<svg width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
{%- if name == 'logo' %}<path d="M5 4h10a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h10"/><path d="M9 8h5"/>
{%- elif name == 'house' %}<path d="M3.5 10.5 12 3.5l8.5 7V20a1 1 0 0 1-1 1H15v-6H9v6H4.5a1 1 0 0 1-1-1z"/>
{%- elif name == 'car' %}<path d="M4.5 12 6.3 7.6A2 2 0 0 1 8.2 6.3h7.6a2 2 0 0 1 1.9 1.3l1.8 4.4"/><path d="M3.5 12h17v4.5h-17z"/><path d="M6.5 16.5v2M17.5 16.5v2"/><path d="M7 14.2h.01M17 14.2h.01"/>
{%- elif name == 'cart' %}<path d="M3 4h2l2.4 10.2a1.5 1.5 0 0 0 1.5 1.1h7.9a1.5 1.5 0 0 0 1.4-1l2-6.3H6.2"/><circle cx="9.5" cy="19.5" r="1.3"/><circle cx="17" cy="19.5" r="1.3"/>
{%- elif name == 'stroller' %}<path d="M14 4v6h6a6 6 0 0 0-6-6z"/><path d="M3 6h2.5l2 6.5A2 2 0 0 0 9.4 14H18a2 2 0 0 0 2-2v-2"/><circle cx="9" cy="18.5" r="1.5"/><circle cx="17" cy="18.5" r="1.5"/>
{%- elif name == 'paw' %}<circle cx="6.5" cy="10" r="1.7"/><circle cx="10" cy="6" r="1.7"/><circle cx="14.5" cy="6" r="1.7"/><circle cx="18" cy="10" r="1.7"/><path d="M8 17.6c0-2.6 2-5.6 4.2-5.6s4.3 3 4.3 5.4c0 1.6-1.2 2.4-2.4 2.4-1 0-1.3-.6-2-.6s-1 .6-2 .6C9 19.8 8 19 8 17.6z"/>
{%- elif name == 'wallet' %}<path d="M18 8V6.5A1.5 1.5 0 0 0 16.5 5H6a2 2 0 0 0 0 4"/><path d="M4 7v10a2 2 0 0 0 2 2h14V9H6"/><path d="M16 14h.01"/>
{%- elif name == 'scale' %}<path d="M12 4v16"/><path d="M8 20h8"/><path d="M5 8h14"/><path d="M5 8l-2.5 6a2.5 2.5 0 0 0 5 0z"/><path d="M19 8l-2.5 6a2.5 2.5 0 0 0 5 0z"/>
{%- elif name == 'user' %}<circle cx="12" cy="8.5" r="3.5"/><path d="M5 20a7 7 0 0 1 14 0"/>
{%- elif name == 'check' %}<path d="M5 12.5l4.5 4.5L19 7.5"/>
{%- elif name == 'trend' %}<path d="M4 19.5h16"/><path d="M5 15.5l4-4.5 3 3 6.5-7"/><path d="M15 7h3.5v3.5"/>
{%- elif name == 'pie' %}<path d="M11 3.6A8.5 8.5 0 1 0 20.4 13H11z"/><path d="M14 3.3V10h6.7A7 7 0 0 0 14 3.3z"/>
{%- elif name == 'bars' %}<path d="M4 20h16"/><path d="M7 16v-5M12 16V6M17 16v-8"/>
{%- elif name == 'calendar' %}<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/>
{%- elif name == 'search' %}<circle cx="11" cy="11" r="6"/><path d="m20 20-4.2-4.2"/>
{%- elif name == 'chev-l' %}<path d="M15 6l-6 6 6 6"/>
{%- elif name == 'chev-r' %}<path d="M9 6l6 6-6 6"/>
{%- elif name == 'plus' %}<path d="M12 5v14M5 12h14"/>
{%- elif name == 'x' %}<path d="M6 6l12 12M18 6 6 18"/>
{%- elif name == 'sun' %}<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6 6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/>
{%- elif name == 'moon' %}<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>
{%- elif name == 'calendar-clock' %}<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4M12 13v3l2 1"/>
{%- endif %}
</svg>
{%- endmacro %}
