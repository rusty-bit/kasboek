# Portainer stack for the NAS. The image comes ready-made from GitHub (ghcr.io); to update, change the version.
# Bind mounts MUST be absolute paths under /volume1/Docker/kasboek: a relative path lands on the 1.8 GB rootfs.
services:
  kasboek:
    image: ghcr.io/rusty-bit/kasboek:0.4.3
    container_name: kasboek
    restart: unless-stopped
    environment:
      DATA_DIR: /data
      TZ: Europe/Amsterdam
      # Optional starting login. Without it Kasboek starts with kasboek / kasboek and asks for your own login
      # after the first sign-in. Change it later in the app (person icon, top right).
      KASBOEK_USER: ${KASBOEK_USER:-}
      KASBOEK_PASSWORD: ${KASBOEK_PASSWORD:-}
    volumes:
      - /volume1/Docker/kasboek/data:/data
    ports:
      - "8420:8000"
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status == 200 else 1)"]
      interval: 60s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
