# Portainer stack for the NAS. The image is built once over SSH (see README "Deploy on the NAS"):
#   cd /volume1/Docker/kasboek/src && docker build -t kasboek:0.2.0 .
# Bind mounts MUST be absolute paths under /volume1/Docker/kasboek: a relative path lands on the 1.8 GB rootfs.
services:
  kasboek:
    image: kasboek:0.2.0
    container_name: kasboek
    restart: unless-stopped
    environment:
      DATA_DIR: /data
      TZ: Europe/Amsterdam
      KASBOEK_USER: ${KASBOEK_USER:-kasboek}
      KASBOEK_PASSWORD: ${KASBOEK_PASSWORD}
    volumes:
      - /volume1/Docker/kasboek/data:/data
    ports:
      - "8420:8000"
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status == 200 else 1)"]
      interval: 60s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
